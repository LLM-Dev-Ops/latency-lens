name: Native Collector Integrity
on:
  pull_request:
    branches: [main]
    paths:
      - crates/core/**
      - crates/metrics/**
      - Cargo.*
      - .github/workflows/collector-contract.yml
permissions:
  contents: read
jobs:
  collector-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: '1.99.1'
      - run: cargo test -p llm-latency-lens-metrics --test collector_validation --locked
      - run: cargo test -p llm-latency-lens-metrics --test breakdown_order --locked
      - run: cargo build -p llm-latency-lens-metrics --locked
